[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cliplayer"
version = "0.0.4a"
description = "Cli Player - Matrix ASCII CLI Video Player (0.0.4 Alpha)"
readme = "README.md"
requires-python = ">=3.6"
license = {text = "MIT"}
authors = [
    {name = "S-Dev", email = "contact@example.com"},
]
dependencies = [
    "opencv-python",
    "numpy",
    "ffmpeg-python",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
cliplayer = "CliPlayer:main"

[tool.setuptools]
py-modules = ["CliPlayer"]

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]
